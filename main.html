<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        body {
            background-color: #1a252c;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #3a324e;
            color: #fff;
            padding: 15px;
            margin: 10px;
            border: 2px solid;
            border-radius: 10px;

        }

        .game-area {
            background-color: #5c94ba;
            min-height: 300px;
            padding: 20px;
            margin: 20px 0;
            border: 5px solid #0f071d;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .game_panels {
            display: flex;
            padding: 20px;
            justify-content: space-between;
            /* background-color: #2c3e50;
            border: 5px solid #0f071d; */
        }

        .platform-container {
            display: flex;
            gap: 50px;
        }

        .player {
            background-color: #ff6b6b;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .platform {
            background-color: #68b04d;
            color: white;
            padding: 10px 50px;
            border-bottom: 6px solid #4a8037;
        }

        .star {
            background-color: #ffd93d;
            color: #000;
            padding: 15px;
            border-radius: 50%;
            font-weight: bold;
        }



        .controls {
            background-color: #222222;
            display: flex;
            justify-content: center;

        }

        .control_row {
            display: flex;
            justify-content: center;
        }

        .panel_controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 20px;
            padding: 20px;
            flex: 1;
            background-color: #2c3e50;
            border-radius: 7%;
            /* border: solid black; */
        }

        .panel_inventory {
            gap: 10px;
            margin: 20px;
            padding: 20px;
            flex: 1;
            background-color: #2c3e50;
            border-radius: 7%;
            /* border: solid black; */
        }

        .panel_quest {
            margin: 20px;
            padding: 20px;
            flex: 1;
            background-color: #2c3e50;
            border-radius: 7%;
            /* border: solid black; */
        }

        .button {
            background-color: #333333;
            color: white;
            font-size: 10px;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        .item {
            background-color: #4a3b75;
            /* Slightly lighter purple */
            color: white;
            padding: 15px;
            width: 50px;
            border: 2px solid #1a252c;
            border-radius: 8px;
            /* flex: 1 makes them grow to fill the space evenly */
            text-align: center;
            font-size: 8px;
        }

        .inv_items {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <header class="game-header">

        <h1>Flexbox Quest</h1>

        <div class="game-info">
            <span>Lives: 3</span>
            <span>Coins: 120</span>
            <span>Level: 1</span>
        </div>

        <div class="header-actions">
            <button class="button">Pause</button>
            <button class="button">Menu</button>
        </div>

    </header>
    <main>

        <section class="game-area">
            <div class="star">⭐ STAR</div>
            <div class="player">PLAYER</div>

            <!-- Grouping platforms in a container helps lay them out side-by-side -->
            <div class="platform-container">
                <div class="platform">PLATFORM</div>
                <div class="platform">PLATFORM</div>
            </div>
        </section>

        <section class="game_panels">

            <div class="panel_controls">
                <h2 style="color:whitesmoke">CONTROLS</h2>

                <div class="control_row">
                    <button class="button">↑</button>
                </div>
                <div class="control_row">
                    <button class="button">←</button>
                    <button class="button">↓</button>
                    <button class="button">→</button>
                </div>
                <div class="control_row">
                    <button class="button">JUMP</button>
                </div>
            </div>

            <div class="panel_inventory">
                <h2 class="inventory" style="color:whitesmoke">INVENTORY</h2>
                <div class="inv_items">
                    <div class="item">Sword</div>
                    <div class="item">Shield</div>
                    <div class="item">Potion</div>
                    <div class="item">Key</div>
                </div>


            </div>

            <div class="panel_quest">
                <h2 style="color:whitesmoke">QUEST</h2>
                <div class="tasks" style="color:whitesmoke">
                    <ul class="list">
                        <li>Collect 1 star</li>
                        <li>Collect 2 star</li>
                        <li>Collect 3 star</li>

                    </ul>
                </div>
            </div>

        </section>
    </main>

    <footer>
        ...
    </footer>

</body>

</html>
